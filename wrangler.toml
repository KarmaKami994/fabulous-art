# FabulousArt — Cloudflare Pages Configuration
name = "fabulous-art"
compatibility_date = "2024-12-01"
pages_build_output_dir = "dist"

# R2 Bucket Binding (Kunden-Uploads)
[[r2_buckets]]
binding = "ORDER_IMAGES"
bucket_name = "fabulous-art-orders"

# Environment Variables (nicht-sensible Werte)
[vars]
MAILJET_FROM_EMAIL = "info@fabulous-art.ch"
MAILJET_FROM_NAME = "FabulousArt"
FABIENNE_EMAIL = "info@fabulous-art.ch"